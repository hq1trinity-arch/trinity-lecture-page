<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>TRINITY ONE 단축 링크</title>
  <link rel="icon" type="image/png" href="../assets/trinity-one-logo.png">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Pretendard", -apple-system, "Segoe UI", sans-serif; background: #F2EFFE; color: #160E2E; word-break: keep-all; text-align: center; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border: 1px solid #E3DEF3; border-radius: 18px; padding: 36px 28px; max-width: 420px; }
    img { height: 48px; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 18px; color: rgba(22,14,46,.6); font-size: 14px; line-height: 1.6; }
    a { display: inline-block; background: #4A1BD0; color: #fff; text-decoration: none; font-weight: 700; padding: 10px 18px; border-radius: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="../assets/trinity-one-logo.png" alt="TRINITY ONE">
    <h1>링크를 찾을 수 없습니다</h1>
    <p>만료되었거나 잘못 입력된 단축 링크입니다.<br>방금 만든 링크라면 1분 뒤 다시 열어 주세요.</p>
    <a href="https://trinityone.co.kr/">TRINITY ONE 홈으로</a>
  </div>
</body>
</html>
