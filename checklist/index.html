<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>신계약 필요서류 체크리스트 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--c:#ee6b1f;--s:#fff1e6;--ink:#1d2433;--sub:#535b6b;--line:#e3e6ec}
body{font-family:'Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;background:#f3f5f8;color:var(--ink);min-height:100vh}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:24px;max-width:1240px;margin:0 auto;padding:24px}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:14px}}
.panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);align-self:start;position:sticky;top:24px}
@media(max-width:900px){.panel{position:static}}
.panel h1{font-size:20px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.panel .hint{font-size:13px;color:var(--sub);margin-bottom:18px}
.f{margin-bottom:16px}
.f>label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px;color:#3a4150}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;font:inherit;font-size:15px;font-weight:700;color:#555d6e;cursor:pointer}
.seg button.on{border-color:var(--c);background:var(--s);color:var(--c)}
input[type=text],input[type=number],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--c)}
.unit{display:flex;align-items:center;gap:8px}.unit span{font-size:15px;color:var(--sub);white-space:nowrap}
.chk{display:flex;align-items:center;gap:9px;font-size:15px;padding:6px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--c)}
.grp{border-top:1px dashed var(--line);padding-top:14px;margin-top:4px}
.grp-t{font-size:12.5px;font-weight:700;color:var(--c);margin-bottom:10px;letter-spacing:.2px}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:900;background:var(--c);color:#fff;cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.5;cursor:wait}
.msg{font-size:13px;color:var(--sub);margin-top:8px;min-height:18px;text-align:center}
.hide{display:none!important}

/* sheet */
.sheet-wrap{overflow:auto}
#sheet{background:#fff;width:794px;min-height:1123px;margin:0 auto;padding:46px 50px 36px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:4px}
@media(max-width:900px){#sheet{width:100%;min-height:0;padding:26px 20px}}
.sh-head{border-bottom:5px solid var(--c);padding-bottom:14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sh-co{font-size:17px;font-weight:700;color:var(--c)}
.sh-title{font-size:32px;font-weight:900;letter-spacing:-1px;margin-top:2px}
.sh-meta{text-align:right;font-size:13px;color:var(--sub);line-height:1.6}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tag{background:var(--s);color:var(--c);font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:20px}
.band{background:var(--c);color:#fff;border-radius:12px;padding:12px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.band b{font-size:19px;font-weight:900}.band span{font-size:14px;opacity:.92}
.warn{background:#fff4f4;border:1.5px solid #f2b8b8;color:#a61b1b;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;margin-bottom:16px}
.sec{margin-bottom:20px}
.sec h2{font-size:19px;font-weight:900;letter-spacing:-.4px;margin-bottom:9px}
.list{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;gap:12px;padding:10px 16px;border-top:1px solid #edf0f4}
.it:first-child{border-top:none}
.box{flex:0 0 22px;height:22px;border:2.5px solid var(--c);border-radius:5px;margin-top:2px}
.no{flex:0 0 20px;font-size:16px;font-weight:900;color:var(--c);margin-top:1px}
.it .t{font-size:16.5px;font-weight:700;letter-spacing:-.3px}
.it .d{font-size:13.5px;color:var(--sub);margin-top:2px;line-height:1.55}
.it .d em{font-style:normal;color:#d6336c;font-weight:700}
.why{display:inline-block;font-size:12px;font-weight:700;color:var(--c);background:var(--s);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;border:1.5px solid var(--line);border-radius:12px;padding:8px 16px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
.cols div{font-size:15px;padding:6px 0 6px 25px;position:relative;border-bottom:1px dashed #e6e9ef;line-height:1.45}
.cols div:before{content:'';position:absolute;left:2px;top:8px;width:13px;height:13px;border:2px solid var(--c);border-radius:3px}
.cols div span{color:var(--sub);font-size:13px}
.finnote{font-size:13.5px;color:var(--sub);background:#f6f7f9;border-radius:8px;padding:8px 12px;margin-top:8px;line-height:1.5}
.none{font-size:14.5px;color:var(--sub);padding:10px 2px}
.foot{margin-top:18px;font-size:12px;color:#8a91a1;text-align:right}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .panel{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  #sheet{width:210mm!important;min-height:0!important;box-shadow:none!important;border-radius:0;padding:10mm 12mm 6mm!important;margin:0;zoom:.94}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .it,.cols div,.sec h2{break-inside:avoid}
  .sec{margin-bottom:12px}.sh-head{margin-bottom:12px}.tags{margin-bottom:10px}.band{margin-bottom:12px;padding:9px 16px}.it{padding:7px 14px}.cols div{padding:4px 0 4px 25px}.foot{margin-top:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>신계약 필요서류 생성기</h1>
    <div class="hint">조건을 고르면 오른쪽에 체크리스트가 바로 만들어집니다.</div>

    <div class="f"><label>보험사</label>
      <div class="seg" data-k="co">
        <button data-v="hanwha" class="on">한화생명</button><button data-v="shinhan">신한라이프</button><button data-v="met">메트라이프</button>
      </div></div>

    <div class="f"><label>계약자</label>
      <div class="seg" data-k="type"><button data-v="corp" class="on">법인</button><button data-v="indiv">개인</button></div></div>

    <div class="f" id="f-uw"><label>심사 유형</label>
      <div class="seg" data-k="uw"><button data-v="simple" class="on">간편</button><button data-v="normal">일반</button></div></div>

    <div class="f" id="f-prem"><label>월납 예상 보험료</label>
      <div class="unit"><input type="number" id="prem" min="0" step="10" placeholder="예: 150"><span>만 원</span></div></div>

    <div id="corp-opts" class="grp">
      <div class="grp-t">법인 계약 조건</div>
      <div class="f" id="f-ins"><label>피보험자</label>
        <select id="ins"><option value="ceo">대표이사</option><option value="reg">등기임원</option><option value="non">비등기임원 · 직원</option></select></div>
      <div class="f" id="f-hist"><label>법인 이력</label>
        <select id="hist"><option value="none">기존 법인</option><option value="conv">개인사업자 → 법인 전환</option><option value="merge">합병 · 분할 법인</option></select></div>
      <label class="chk" id="f-young"><input type="checkbox" id="young"> 설립 2년 미만</label>
      <label class="chk" id="f-agent"><input type="checkbox" id="agent"> 대리인이 진행</label>
    </div>

    <div class="grp">
      <div class="grp-t">PDF에 표시 (선택)</div>
      <div class="f"><label>계약자명 (법인명 · 고객명)</label><input type="text" id="cname" placeholder="예: ㈜○○○"></div>
      <div class="f"><label>담당 설계사</label><input type="text" id="agentname" placeholder="예: 홍길동"></div>
    </div>

    <button class="btn" id="pdf">PDF로 저장</button>
    <div class="msg" id="msg">인쇄 창이 뜨면 대상(프린터)을 <b>‘PDF로 저장’</b>으로 선택하세요.</div>
  </div>

  <div class="sheet-wrap"><div id="sheet"></div></div>
</div>

<script>
const CO = {
  hanwha:{name:'한화생명', c:'#ee6b1f', s:'#fff1e6', period:'발급 3개월 이내', periodSub:'등기부등본 · 주주명부'},
  shinhan:{name:'신한라이프', c:'#0046ff', s:'#eaf0ff', period:'발급 90일 이내', periodSub:'법인서류 전부'},
  met:{name:'메트라이프', c:'#0a7cc4', s:'#e6f3fb', period:'발급 3개월 이내', periodSub:'주주명부 · 등기부등본 · 인감증명서'}
};
const BIZ = ['사업자등록증 사본', '사업자등록증명원도 가능'];
const SH_RULE = '<em>날짜 수기 작성 불가</em> · 성명 · 생년월일 · 주식 수 · 지분율 기재<br>주식회사는 반드시 <em>“주주명부”</em> 명칭 (사원명부 등 불가)';
const FS = '재무제표 (직전 3개년)';
const FIN = {hanwha:'소득금액증명원 · 재무제표 · 손익계산서 · 매출·비용 기재 자료 · 공시자료 · 감사보고서 · 부동산 등기부등본 등', shinhan:'재무제표 (직전 3개년)', met:''};

const HW_SIMPLE = ['3개월 내 확정진단 · 질병의심 · 필요소견 · 추가(재검사) 소견','2년 내 (질병·재해) 입원 · 수술','5년 내 암 · 간경화증 · 투석 중 만성신장질환','근무처','운전 여부','월소득 <span>(계약자 기준)</span>','직업','주소 · 연락처'];
const HW_NORMAL = ['최근 5년 치료력 <span>(입원·수술 / 약 복용, 언제부터)</span>','5년 내 10대 질병 <span>(암·뇌·심 등)</span>','운전 여부','키 · 몸무게','음주 · 흡연 여부','직업 · 근무처','월소득 <span>(계약자)</span>','주소 · 연락처'];
const MET_MOBILE = ['모집자 사번','모집자 생년월일','모집경로 <span>(신규 · 소개)</span>','면담장소 <span>(예: 역삼동)</span>','승환 여부 <span>(유/무)</span>','고객 이메일 <span>(생략 가능)</span>','고객 휴대폰 통신사','병력','직장명 · 직업','월소득','키 · 몸무게','은행명 · 계좌번호 · 이체희망일'];

function build(st){
  const r = {req:[], add:[], info:[], infoTitle:'', warn:null};
  const corp = st.type==='corp';
  if(st.co==='hanwha'){
    if(corp){
      if(st.ins==='non') r.warn='한화생명 법인 계약은 피보험자가 법인 대표 또는 등기임원인 경우에만 가입할 수 있습니다.';
      r.req=[BIZ,['법인등기부등본 전부증명서 사본','말소사항 포함'],['주주명부','<em>법인직인 날인</em>된 것<br>'+SH_RULE],['법인 통장 사본',''],['대표 · 피보험자 신분증 사본','']];
      if(st.prem>=200) r.add.push([FS+' + 크레탑','크레탑: 기업신용정보 보고서','월납 200만 원 이상']);
      if(st.young && st.hist==='conv') r.add.push(['사업양수도계약서 · 개인사업 재무제표 (3개년)','','설립 2년 미만 · 전환 법인']);
      if(st.young && st.hist==='merge') r.add.push(['분할·합병 계획서 · 이전 사업체 재무제표 (3개년)','','설립 2년 미만 · 합병·분할']);
      if(st.fin) r.add.push(['소득금액증명원 · 재무제표 · 손익계산서 · 매출·비용 기재 자료','공시자료 · 감사보고서 · 부동산 등기부등본 등 (사업자 · 대표 기준)','재정심사 요청']);
    } else {
      r.req=[['신분증 사본','본인 확인용']];
    }
    r.infoTitle = st.uw==='simple' ? '알릴의무 · 간편체 (종신 · 보험)' : '알릴의무 · 일반체 (건강체)';
    r.info = st.uw==='simple' ? HW_SIMPLE : HW_NORMAL;
  }
  if(st.co==='shinhan'){
    if(corp){
      r.req=[['법인등기부등본','전부증명서 · 말소사항 포함 · <em>발급(제출)용만, 열람용 불가</em>'],['법인 통장 사본',''],['주주명부','발행일 기재 · <em>법인인감 날인 필수</em><br>'+SH_RULE],BIZ,['대표 신분증 사본','공동대표면 모두 제출']];
      if(st.ins==='non') r.add.push(['재직증명서','대표 · 등기임원은 제출 안 함','피보험자 비등기임원·직원']);
      if(st.agent) r.add.push(['대리인 신분증 사본','비등기임원이면 재직증명서 또는 명함 추가','대리인 진행']);
      if(st.fin) r.add.push([FS,'','재정심사 요청']);
    } else {
      r.req=[['신분증 사본',''],['통장 사본','']];
      r.infoTitle='확인 정보';
      r.info = st.uw==='normal' ? ['키 · 몸무게','월소득'] : ['월소득'];
    }
  }
  if(st.co==='met'){
    if(corp){
      r.req=[BIZ,['주주명부','하단 <em>법인인감도장 필수</em><br>'+SH_RULE],['법인등기부등본 원본','<em>주민번호 마스킹</em> 지분 25% 이상은 생년월일만 남기고 뒷자리 가림 · 25% 미만은 전체 가림'],[FS,''],['법인 인감증명서','']];
      if(st.hist==='conv') r.add.push(['개인사업자 폐업사실증명서','','개인사업자 → 법인 전환']);
    } else {
      r.req=[['신분증 또는 운전면허증 앞면 사진','실명확인용']];
    }
    r.infoTitle='모바일청약 필수 확인사항';
    r.info=MET_MOBILE;
  }
  return r;
}

const st={co:'hanwha',type:'corp',uw:'simple'};
const $=id=>document.getElementById(id);

function vis(){
  const corp=st.type==='corp', co=st.co;
  $('f-uw').classList.toggle('hide', co==='met');
  $('corp-opts').classList.toggle('hide', !corp);
  $('f-ins').classList.toggle('hide', co==='met');
  $('f-hist').classList.toggle('hide', co==='shinhan');
  $('f-young').classList.toggle('hide', co!=='hanwha');
  $('f-agent').classList.toggle('hide', co!=='shinhan');
}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function render(){
  Object.assign(st,{prem:parseFloat($('prem').value)||0, ins:$('ins').value, hist:$('hist').value, young:$('young').checked, agent:$('agent').checked, fin:false});
  const c=CO[st.co]; document.documentElement.style.setProperty('--c',c.c); document.documentElement.style.setProperty('--s',c.s);
  vis();
  const r=build(st), corp=st.type==='corp';
  const today=new Date(); const ds=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const cname=$('cname').value.trim(), an=$('agentname').value.trim();
  const tags=[corp?'법인 계약':'개인 계약'];
  if(st.co!=='met') tags.push(st.uw==='simple'?'간편 심사':'일반 심사');
  if(st.prem) tags.push(`월납 ${st.prem.toLocaleString()}만 원`);
  if(corp&&st.co!=='met') tags.push({ceo:'피보험자: 대표이사',reg:'피보험자: 등기임원',non:'피보험자: 비등기임원·직원'}[st.ins]);
  if(corp&&st.hist!=='none'&&st.co!=='shinhan') tags.push(st.hist==='conv'?'개인→법인 전환':'합병·분할');
  if(corp&&st.young&&st.co==='hanwha') tags.push('설립 2년 미만');
  if(corp&&st.agent&&st.co==='shinhan') tags.push('대리인 진행');

  const item=(x,i,why)=>`<div class="it"><div class="box"></div><div class="no">${i}</div><div><div class="t">${x[0]}${why?`<span class="why">${esc(why)}</span>`:''}</div>${x[1]?`<div class="d">${x[1]}</div>`:''}</div></div>`;
  let h=`<div class="sh-head"><div><div class="sh-co">${c.name}</div><div class="sh-title">신계약 필요서류</div></div>
    <div class="sh-meta">${cname?`계약자 <b>${esc(cname)}</b><br>`:''}${an?`담당 ${esc(an)}<br>`:''}작성일 ${ds}</div></div>
    <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  if(corp) h+=`<div class="band"><b>${c.period}</b><span>${c.periodSub}</span></div>`;
  if(r.warn) h+=`<div class="warn">⚠ ${r.warn}</div>`;
  h+=`<div class="sec"><h2>① 필수 서류</h2><div class="list">${r.req.map((x,i)=>item(x,i+1)).join('')}</div></div>`;
  if(corp){
    h+=`<div class="sec"><h2>② 추가 서류</h2>`+(r.add.length?`<div class="list">${r.add.map((x,i)=>item(x,r.req.length+i+1,x[2])).join('')}</div>`:`<div class="none">선택한 조건에서는 추가 서류가 없습니다.</div>`)+(FIN[st.co]?`<div class="finnote">※ 보험사에서 재정심사를 요청하면 추가 제출: ${FIN[st.co]}</div>`:'')+`</div>`;
  }
  if(r.info.length) h+=`<div class="sec"><h2>${corp?'③':'②'} ${r.infoTitle}</h2><div class="cols">${r.info.map(x=>`<div>${x}</div>`).join('')}</div></div>`;
  h+=`<div class="foot">2026년 11월 기준 · 보험사 안내가 변경될 수 있으니 최신 안내를 함께 확인하세요</div>`;
  $('sheet').innerHTML=h;
}

document.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  st[g.dataset.k]=b.dataset.v; render();
}));
['prem','ins','hist','young','agent','cname','agentname'].forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});
render();

// PDF: 인쇄 창에서 'PDF로 저장' 선택
$('pdf').addEventListener('click',()=>{
  const cname=$('cname').value.trim(); const old=document.title;
  document.title=`${CO[st.co].name}_${st.type==='corp'?'법인':'개인'}_필요서류${cname?'_'+cname:''}`;
  window.print(); setTimeout(()=>document.title=old,1000);
});
</script>
</body>
</html>
